<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>砂時計 物理シミュレーション プロトタイプ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>砂時計 物理シミュレーション プロトタイプ</h1>

    <canvas id="canvas" width="520" height="760"></canvas>

    <div class="controls">
      <label class="control-row">
        粒子数
        <input type="range" id="particleCount" min="200" max="5000" step="100" value="2000">
        <span id="particleCountValue">2000</span>
      </label>

      <div class="control-row buttons">
        <button id="resetBtn">リセット（粒子を再生成）</button>
        <button id="flipBtn">反転（ひっくり返す）</button>
      </div>

      <div class="stats">
        <span id="fps">FPS: --</span>
        <span id="particleActual">配置粒子数: --</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
